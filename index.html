<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STANJAK 2027">
  <title>STANJAK 2027 | Buku Pengurusan</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root { color-scheme: dark; --navy:#101827; --navy2:#17243a; --orange:#f26b21; --cream:#f7f3ec; --muted:#b9c4d4; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
      padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:var(--cream); background:
      radial-gradient(circle at 15% 10%, rgba(242,107,33,.18), transparent 30%),
      radial-gradient(circle at 90% 85%, rgba(60,103,190,.18), transparent 32%),
      linear-gradient(145deg,var(--navy),var(--navy2));
    }
    .shell { width:100%; max-width:440px; }
    .card { padding:32px 26px 26px; border:1px solid rgba(255,255,255,.13); border-radius:28px;
      background:rgba(255,255,255,.055); box-shadow:0 24px 70px rgba(0,0,0,.25); text-align:center; }
    .logo { width:112px; height:112px; object-fit:contain; border-radius:24px; background:#160b09;
      box-shadow:0 10px 32px rgba(0,0,0,.24); }
    .eyebrow { margin:24px 0 8px; color:#ffb17d; font-size:11px; letter-spacing:.2em; font-weight:800; }
    h1 { margin:0; font-size:clamp(29px,8vw,38px); letter-spacing:-.045em; line-height:1.08; }
    .subtitle { margin:12px auto 0; max-width:290px; color:var(--muted); font-size:15px; line-height:1.6; }
    .rule { width:52px; height:4px; border-radius:10px; margin:24px auto; background:var(--orange); }
    .button { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:56px;
      padding:15px 18px; border-radius:16px; background:var(--orange); color:#fff; text-decoration:none;
      font-weight:750; font-size:16px; box-shadow:0 10px 26px rgba(242,107,33,.2); transition:transform .15s ease; }
    .button:active { transform:scale(.985); }
    .arrow { font-size:20px; line-height:1; }
    .hint { margin:20px 0 0; color:#aeb9ca; font-size:12px; line-height:1.55; }
    .footer { text-align:center; color:#8190a5; font-size:11px; margin:18px 0 0; letter-spacing:.04em; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Pelancaran portal STANJAK 2027">
      <img class="logo" src="./apple-touch-icon.png" alt="Lencana sekolah">
      <p class="eyebrow">BUKU PENGURUSAN SEKOLAH</p>
      <h1>STANJAK <span style="color:#ff8a45">2027</span></h1>
      <p class="subtitle">Portal pengurusan sekolah<br>akses pantas untuk warga sekolah</p>
      <div class="rule"></div>
      <a class="button" href="https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbxyiP45N_KvrjQPp-BABkD1ci6ZycmKJ_yuV9LTfhVj87e9tV-paiQYuZQn6ldpwWpMog/exec" rel="noopener">
        Buka Portal STANJAK <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <p class="hint">Tip iPhone: tambah halaman ini ke Home Screen supaya ikon sekolah dipaparkan. Tekan butang di atas untuk membuka portal.</p>
    </section>
    <p class="footer">STANJAK 2027 · PORTAL SEKOLAH</p>
  </main>
</body>
</html>
